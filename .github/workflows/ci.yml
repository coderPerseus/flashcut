name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: Typecheck the frontend
        run: bunx tsc --noEmit
      - name: Build the app
        run: ./node_modules/.bin/mygo build -platform darwin/universal
      - uses: actions/upload-artifact@v4
        with:
          name: FlashCut-macOS
          path: build/darwin-universal/*.dmg
          if-no-files-found: error
