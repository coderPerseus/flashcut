<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>闪剪</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="logo">⚡</span>
        <div>
          <h1>闪剪</h1>
          <p id="project-name" class="muted">说一句话，剪好一条视频</p>
        </div>
      </div>
      <div class="actions">
        <button id="open">打开视频</button>
        <button id="undo" hidden title="撤销 (⌘Z)">撤销</button>
        <button id="settings-btn" title="设置">设置</button>
        <button id="export" class="primary" hidden>导出成片</button>
      </div>
    </header>

    <section id="home" class="home">
      <div class="hero">
        <div class="hero-icon">⚡</div>
        <h2>把长视频剪成精华</h2>
        <p class="muted">打开任意视频，用一句话说出要求：“只保留进球”“去掉片头广告”“控制在 3 分钟”。闪剪会逐段看完视频，按你的要求挑出片段，再一键导出。</p>
        <button id="open-big" class="primary big">打开视频</button>
        <p id="home-status" class="status-line"></p>
      </div>
      <div id="recent" class="recent"></div>
    </section>

    <main id="workspace" hidden>
      <section class="editor">
        <div class="card player-card">
          <video id="video" controls preload="metadata"></video>
          <div class="player-bar">
            <label class="check"><input id="preview" type="checkbox" /> 只看成片（跳过被剪掉的部分）</label>
            <span id="summary" class="muted"></span>
          </div>
        </div>

        <div class="card">
          <div class="row">
            <h3>时间线</h3>
            <div class="legend muted">
              <span><i class="sw kept"></i>保留</span>
              <span><i class="sw dropped"></i>剪掉</span>
              <span><i class="sw pending"></i>待分析</span>
              <span><i class="sw failed"></i>失败</span>
              <span>柱高 = 精彩程度</span>
            </div>
          </div>
          <div id="timeline" class="timeline"><div id="playhead" class="playhead"></div></div>
          <div id="ranges-bar" class="ranges-bar"></div>
          <div id="detail" class="detail muted">点击时间线上的一段可以跳转预览，并手动保留或剪掉。</div>
          <div id="seg-actions" class="seg-actions" hidden>
            <button data-mode="keep">保留这段</button>
            <button data-mode="drop">剪掉这段</button>
            <button data-mode="auto">交给 AI</button>
          </div>
        </div>

        <div class="card">
          <div class="row">
            <h3>剪辑要求</h3>
            <div class="actions wrap">
              <select id="tpl-select" title="选择模板"></select>
              <button id="tpl-apply" class="small">套用模板</button>
              <button id="tpl-manage" class="small">管理模板</button>
              <button id="tpl-save" class="small" title="把当前的剪辑要求存成模板">存为模板</button>
              <button id="analyze" class="small primary">智能剪辑</button>
            </div>
          </div>
          <p id="tpl-current" class="muted note"></p>
          <div id="rules" class="rules"></div>
          <div class="options">
            <label id="interest-opt">
              精彩程度 ≥ <b id="interest-v"></b>
              <input id="interest" type="range" min="0.5" max="4" step="0.1" />
            </label>
            <label>
              时长上限
              <input id="target" type="number" min="0" step="10" placeholder="不限" /> 秒
            </label>
            <label>
              片段前后多留
              <select id="pad"><option value="0">0 秒</option><option value="1">1 秒</option><option value="2">2 秒</option><option value="4">4 秒</option></select>
            </label>
            <label class="check"><input id="fill" type="checkbox" /> 补齐片段间的小空隙</label>
          </div>
        </div>

        <div id="result" class="card result" hidden>
          <div class="row">
            <h3>已导出</h3>
            <div class="actions"><button id="reveal" class="small">在 Finder 中显示</button></div>
          </div>
          <video id="out-video" controls preload="metadata"></video>
          <div id="out-meta" class="muted"></div>
        </div>
      </section>

      <aside class="chat card">
        <div class="chat-head">
          <h3>聊天剪辑</h3>
          <span id="connection" class="muted"></span>
        </div>
        <div id="messages" class="messages"></div>
        <div id="progress" class="progress" hidden>
          <div class="progress-text"><span id="progress-label"></span><button id="stop" class="link">停止</button></div>
          <div class="bar"><div></div></div>
        </div>
        <div id="chips" class="chips"></div>
        <form id="composer" class="composer">
          <textarea id="input" rows="2" placeholder="说说想怎么剪，例如：只保留击杀和团战，控制在 5 分钟以内"></textarea>
          <button class="primary" type="submit">发送</button>
        </form>
      </aside>
    </main>

    <div id="toast" class="toast" hidden></div>

    <dialog id="settings">
      <form method="dialog" class="settings-form">
        <h3>设置</h3>
        <fieldset>
          <legend>Cloudflare 连接</legend>
          <p id="conn-status" class="muted"></p>
          <label>Account ID <input id="s-account" autocomplete="off" spellcheck="false" /></label>
          <label>API Token <input id="s-token" type="password" autocomplete="off" spellcheck="false" /></label>
          <label class="check"><input id="s-clear" type="checkbox" /> 清除已保存的凭证，改用已登录的 cf 命令行</label>
          <p class="hint muted">需要 Workers AI 权限。不填时使用本机已登录的 <code>cf</code> 命令行（<code>cf auth login</code>）。凭证只保存在本机。</p>
        </fieldset>
        <fieldset>
          <legend>分析与导出</legend>
          <label>同时分析
            <select id="s-concurrency">
              <option value="2">2 段</option><option value="4">4 段</option><option value="6">6 段</option><option value="8">8 段</option>
            </select>
          </label>
          <label>导出画质
            <select id="s-quality">
              <option value="high">高（文件大）</option>
              <option value="medium">标准</option>
              <option value="small">小（最高 720p，方便分享）</option>
            </select>
          </label>
          <label>新视频默认套用模板
            <select id="s-template"></select>
          </label>
          <p id="ffmpeg-status" class="hint"></p>
        </fieldset>
        <div class="actions end">
          <button value="cancel">取消</button>
          <button id="s-save" class="primary" value="save">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="tpl-dialog" class="wide">
      <div class="tpl-layout">
        <aside class="tpl-list">
          <div class="row"><h3>模板</h3><button id="tpl-new" class="small">新建</button></div>
          <div id="tpl-items"></div>
          <div class="actions wrap">
            <button id="tpl-import" class="small">导入…</button>
          </div>
        </aside>
        <section class="tpl-editor">
          <div id="tpl-form"></div>
          <div class="actions end tpl-footer">
            <span id="tpl-error" class="error-text"></span>
            <button id="tpl-export" class="small">导出…</button>
            <button id="tpl-duplicate" class="small">复制</button>
            <button id="tpl-delete" class="small danger">删除</button>
            <button id="tpl-close">关闭</button>
            <button id="tpl-save-btn" class="primary">保存</button>
          </div>
        </section>
      </div>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
