<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Near-black tile with a faint top light, like a camera body. -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232326"/>
      <stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <polyline points="672,170 524,500 616,500 448,870" fill="none" stroke="#000" stroke-width="64" stroke-linejoin="miter" stroke-miterlimit="10"/>
    </mask>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="188.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- The play mark, split by the cut. -->
  <g mask="url(#cut)">
    <path d="M380 292 Q356 280 356 308 L356 716 Q356 744 380 732 L748 530 Q772 512 748 494 Z" fill="#f5f5f7"/>
  </g>
  <!-- The flash inside the cut. -->
  <polyline points="626,272 524,500 616,500 506,742" fill="none" stroke="#ffb020" stroke-width="24" stroke-linejoin="miter" stroke-miterlimit="10" stroke-linecap="round"/>
</svg>
